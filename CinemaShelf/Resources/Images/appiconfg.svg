<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Golden background outside circle -->
  <rect width="512" height="512" fill="#F9A825"/>
  <!-- Dark purple circle with white border -->
  <circle cx="256" cy="256" r="140" fill="#2D1B69" stroke="white" stroke-width="5" filter="url(#glow)"/>
  <!-- Smaller golden play triangle with white border -->
  <polygon points="230,195 325,256 230,317" fill="#FFD700" stroke="white" stroke-width="4" filter="url(#glow)"/>
</svg>
